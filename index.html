<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Datenschutzerklärung – Fahrschul-Planer</title>
  <link rel="canonical" href="https://fahrschul-planer.de/datenschutz" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="0; url=https://fahrschul-planer.de/datenschutz" />
  <script>
    // Alte Links mit #impressum gehen aufs eigene Impressum, andere Anker (#konto-loeschen) bleiben erhalten.
    location.replace(location.hash === '#impressum' ? 'https://fahrschul-planer.de/impressum'
      : 'https://fahrschul-planer.de/datenschutz' + location.hash);
  </script>
</head>
<body>
  <p>Die Datenschutzerklärung ist umgezogen: <a href="https://fahrschul-planer.de/datenschutz">fahrschul-planer.de/datenschutz</a></p>
</body>
</html>
